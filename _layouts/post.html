---
layout: default
---
<a class="back" href="{{ '/notes/' | relative_url }}">← 所有记录</a>
<article class="post">
  <header class="post-header">
    <time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%Y.%m.%d" }}</time>
    <h1>{{ page.title }}</h1>
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
<nav class="post-nav">
  {% if page.previous %}<a href="{{ page.previous.url | relative_url }}"><small>上一篇</small>{{ page.previous.title }}</a>{% else %}<span></span>{% endif %}
  {% if page.next %}<a class="next" href="{{ page.next.url | relative_url }}"><small>下一篇</small>{{ page.next.title }}</a>{% endif %}
</nav>
